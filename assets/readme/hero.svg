<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">概念探险队 Concept Atlas — 一图，搞懂。121 张竖版知识漫画</title>
  <desc id="desc">暖纸底标题：概念探险队，一图，搞懂；右侧是一张迷你知识漫画，画着潮汐锁定：地球居中，月球沿轨道绕转，底部芥末黄条写着自转1圈等于公转1圈。</desc>

  <rect width="1200" height="360" rx="26" fill="#fff7e7"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#17324a">一图搞懂一个概念 · ILLUSTRATED EXPLAINERS</text>
    <text x="56" y="128" font-size="62" font-weight="700" fill="#17324a">概念探险队</text>
    <text x="56" y="168" font-size="23" fill="#17324a">一图，搞懂。— 121 张竖版知识漫画</text>
    <text x="56" y="204" font-size="19" fill="#57534e">体育、摄影、金融、物理等 9 个领域，每张讲清一个概念。</text>
    <g id="chips" font-size="18" fill="#17324a" text-anchor="middle">
      <g><rect x="56" y="238" width="126" height="36" rx="18" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/><text x="119" y="262">121 张漫画</text></g>
      <g><rect x="194" y="238" width="108" height="36" rx="18" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/><text x="248" y="262">9 大领域</text></g>
      <g><rect x="314" y="238" width="126" height="36" rx="18" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/><text x="377" y="262">3:4 竖版</text></g>
      <g><rect x="452" y="238" width="144" height="36" rx="18" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/><text x="524" y="262">原图可下载</text></g>
    </g>
  </g>

  <g id="mini-poster">
    <rect x="880" y="30" width="230" height="300" fill="#fff7e7" stroke="#17324a" stroke-width="3"/>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
      <text x="995" y="60" font-size="15" fill="#17324a" text-anchor="middle">概念探险队 · 第 16 期</text>
      <text x="995" y="94" font-size="30" font-weight="700" fill="#17324a" text-anchor="middle">潮汐锁定</text>
    </g>
    <g id="orbit-diagram">
      <ellipse cx="995" cy="180" rx="78" ry="58" fill="none" stroke="#17324a" stroke-width="2.5"/>
      <circle cx="995" cy="180" r="26" fill="#3879b8"/>
      <ellipse cx="988" cy="172" rx="10" ry="7" fill="#4f8d78"/>
      <ellipse cx="1004" cy="190" rx="8" ry="5" fill="#4f8d78"/>
      <circle cx="917" cy="180" r="11" fill="#d6d3d1" stroke="#17324a" stroke-width="2"/>
      <circle cx="1073" cy="180" r="11" fill="#d6d3d1" stroke="#17324a" stroke-width="2"/>
      <circle cx="995" cy="122" r="11" fill="#d6d3d1" stroke="#17324a" stroke-width="2"/>
      <circle cx="995" cy="238" r="11" fill="#d6d3d1" stroke="#17324a" stroke-width="2"/>
      <circle cx="920" cy="177" r="4" fill="#d85c43"/>
      <circle cx="1076" cy="177" r="4" fill="#d85c43"/>
      <circle cx="998" cy="119" r="4" fill="#d85c43"/>
      <circle cx="998" cy="235" r="4" fill="#d85c43"/>
    </g>
    <g id="takeaway-band" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
      <rect x="892" y="272" width="206" height="42" fill="#e8b751"/>
      <text x="995" y="299" font-size="18" font-weight="700" fill="#17324a" text-anchor="middle">自转 1 圈 = 公转 1 圈</text>
    </g>
  </g>
</svg>
